name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android --org com.fatih .

      - name: Set app display name
        run: |
          sed -i 's/android:label="antigaspi_app"/android:label="Anti-Gaspi"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigaspi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK for release
        run: cp build/app/outputs/flutter-apk/app-release.apk antigaspi-${{ github.run_number }}.apk

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "antigaspi-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Anti-Gaspi build ${{ github.run_number }}" \
            --notes "APK compilé automatiquement depuis le commit ${{ github.sha }}."
